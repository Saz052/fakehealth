name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools
            ndk;27.1.12297006

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fakehealth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV
          echo "APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_ENV

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: fakehealth-debug-apk
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: "FakeHealth ${{ github.ref_name }}"
          body: |
            ## FakeHealth - Samsung Health Clone (Secret Data Editor)

            ### 📱 Что внутри
            - Публичный режим: полная копия UI Samsung Health
            - Секретный режим: 5 тапов → PIN → редактор данных (шаги, калории, сон, пульс)

            ### 🔐 Как активировать секрет
            1. Откройте приложение
            2. Быстро тапните по экрану **5 раз**
            3. При первом входе — задайте 4-значный PIN
            4. Далее — вводите PIN для входа в редактор

            ### 📊 Накачиваемые метрики
            - 👟 Шаги
            - 🔥 Калории
            - 😴 Сон (часы/минуты)
            - ❤️ Пульс (средний/мин/макс)

            ### 📦 Установка
            Скачайте `app-debug.apk` ниже и установите на Android (API 26+).

            ---
            **SHA256:** `${{ env.APK_SHA256 }}`
            **Размер:** ${{ env.APK_SIZE }} байт
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}